server:
    port: 8081
    servlet:
        context-path: /travel

spring:
    # 把项目根目录的 .env 当作 properties 文件导入（前端同款手感）。
    # optional: 前缀表示文件不存在也不报错；[.properties] 是告诉 Boot 用 properties 解析器，
    # 否则它会因为文件没有扩展名而拒绝加载。
    # .env 已在 .gitignore 中忽略，仓库里只提交 .env.example。
    config:
        import: optional:file:./.env[.properties]

    datasource:
        driver-class-name: com.mysql.cj.jdbc.Driver
        url: "jdbc:mysql://localhost:3306/travel_management?useUnicode=true&characterEncoding=utf8&useSSL=false&serverTimezone=Asia/Shanghai&rewriteBatchedStatements=true"
        username: root
        password: 123456

        # ===== HikariCP（Spring Boot 默认连接池） =====
        hikari:
            pool-name: TravelHikariPool
            maximum-pool-size: 20
            minimum-idle: 2
            connection-timeout: 60000
            idle-timeout: 600000
            max-lifetime: 1800000

    # ===== Redis =====
    # Boot 3 起配置前缀由 spring.redis.* 改为 spring.data.redis.*，
    # 旧前缀不会报错、会静默失效（连到默认的 localhost:6379/db0），排查时极易误判。
    data:
        redis:
            host: localhost
            port: 6379
            # 本地 Redis 未启用 requirepass（redis-cli 执行 acl list 可见 user default on nopass）。
            # 若你的 Redis 配了密码，取消下面一行注释并改成实际密码；否则 Redisson 发 AUTH 会直接连不上。
            # password: 123456
            database: 0
            timeout: 3000ms
            connect-timeout: 3000ms
            client-name: travel-app
            lettuce:
                shutdown-timeout: 200ms

    # ===== Spring AI（DeepSeek 走 OpenAI 兼容协议） =====
    # Key 不要写进本文件：复制 backend/.env.example 为 backend/.env 填好即可
    # （application.yml 通过 spring.config.import 把 .env 当 properties 读入）。
    # 也支持环境变量 DEEPSEEK_API_KEY，且优先级高于 .env。
    ai:
        openai:
            base-url: https://api.deepseek.com
            api-key: ${DEEPSEEK_API_KEY:sk-not-configured}
            chat:
                options:
                    # deepseek-chat 比 deepseek-reasoner 快且便宜，行程规划这类结构化任务够用
                    model: deepseek-chat
                    # 结构化输出优先稳定，温度压低
                    temperature: 0.5
                    # 每个景点要写交通/介绍/注意事项，7 天 × 4 个景点约 3-4k tokens，留足余量
                    max-tokens: 5000
        # 上游不可达时不要长时间重试：默认策略会退避重试多次，
        # 用户端表现为"点了生成一直转圈"。这里限制成 2 次、总退避不到 2 秒，
        # 失败就立刻给可读提示，让用户自己决定要不要重试。
        retry:
            max-attempts: 2
            backoff:
                initial-interval: 300ms
                multiplier: 2
                max-interval: 2s

    # 出站 HTTP 超时（Spring AI 的 RestClient 走这套默认值）
    http:
        client:
            connect-timeout: 5s
            read-timeout: 60s

    # ===== 文件上传 =====
    servlet:
        multipart:
            max-file-size: 10MB
            max-request-size: 10MB

# ===== 缓存开关 =====
# true=正常走缓存；false=直接回源查库（排障或压测基线时用，启动参数 --travel.cache.enabled=false 可覆盖）
travel:
    cache:
        enabled: true
    # ===== 浏览量回写 =====
    # 详情接口只 INCR，定时任务按此间隔把增量写回 MySQL（毫秒）
    view:
        flush-interval-ms: 60000
    # ===== 文件上传 =====
    # 上传根目录（相对项目根目录），通过 /uploads/** 静态访问
    upload:
        dir: "./uploads"
    # ===== AI 行程规划 =====
    ai:
        # 总开关：false 时 /ai/** 直接返回"AI 未启用"，不影响其他功能
        enabled: true
        # 每人每天最多生成的次数（Redis 计数，按自然日归零）
        daily-limit: 10
        # 每天最多安排几个景点，超出部分由服务端截断
        max-spots-per-day: 5

# ===== Sa-Token 登录鉴权 =====
# 会话由 sa-token-redis-jackson 写入同一个 Redis（key 前缀 satoken:），因此重启不掉线
sa-token:
    token-name: Authorization
    token-prefix: Bearer
    # 绝对有效期 24 小时（秒）
    timeout: 86400
    # 30 分钟无操作自动过期（秒），有请求即自动续期
    active-timeout: 1800
    # 允许多端登录，但每端独立 token（踢人时一次性踢掉该账号全部 token）
    is-concurrent: true
    is-share: false
    # 前后端分离：只从 Header 取 token，不读 Cookie
    is-read-cookie: false
    # 短 token，不连续，降低被遍历风险
    token-style: tik
    # 关闭启动横幅与操作日志，避免刷屏
    is-print: false
    is-log: false

mybatis:
    type-aliases-package: com.zjx.travel.domain
    mapper-locations: "classpath*:mapper/*Mapper.xml"
    configuration:
        log-impl: org.apache.ibatis.logging.stdout.StdOutImpl

# 日志（Logback，Spring Boot 默认）
logging:
    level:
        com.zjx.travel: INFO

# ===== 接口文档（SpringDoc / OpenAPI 3） =====
# 原 Knife4j 已移除（其内置 springdoc 2.3.0 与 Spring 6.2 不兼容）。
# 文档地址：http://localhost:8081/travel/swagger-ui/index.html
# OpenAPI JSON：http://localhost:8081/travel/v3/api-docs
springdoc:
    api-docs:
        path: /v3/api-docs
    swagger-ui:
        path: /swagger-ui.html